<div class="blog-list">
  <div class="header-actions">
    <a routerLink="/posts/new" class="btn btn-primary">+ New Post</a>
  </div>
  
  <div class="filters">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      (input)="filterPosts()"
      placeholder="Search posts..."
      class="search-input">
  </div>

  <div class="posts-container">
    <div class="posts-grid">
      <div *ngFor="let post of filteredPosts" class="post-card">
        <!-- MODO LECTURA -->
        <div *ngIf="editingPostId !== post.id">
          <h3>{{ post.title }}</h3>

          <!-- Badges de categorías en cada post -->
          <div class="categories-badges" *ngIf="post.categories_detail && post.categories_detail.length > 0" style="margin: 6px 0 10px 0;">
            <span 
              *ngFor="let cat of post.categories_detail" 
              class="badge bg-secondary"
              style="display: inline-block; padding: 3px 8px; margin-right: 5px; background-color: #6c757d; color: #fff; border-radius: 4px; font-size: 11px;">
              {{ cat.name }}
            </span>
          </div>

          <p class="post-content" *ngIf="!isExpanded(post.id)">
            {{ post.content | slice:0:150 }}...
          </p>
          <p class="post-content expanded" *ngIf="isExpanded(post.id)">
            {{ post.content }}
          </p>
          <div class="post-meta">
            <span>Created: {{ post.created_at | date:'short' }}</span>
            <span *ngIf="post.updated_at !== post.created_at">
              Updated: {{ post.updated_at | date:'short' }}
            </span>
          </div>
          <div class="post-actions">
            <a [routerLink]="['/posts', post.id]" class="btn btn-sm btn-primary">Open</a>
            <button (click)="startEdit(post)" class="btn btn-sm btn-secondary">Edit</button>
            <button (click)="deletePost(post.id)" class="btn btn-sm btn-danger">Delete</button>
          </div>
        </div>
        
        <!-- MODO EDICIÓN IN-LINE -->
        <div *ngIf="editingPostId === post.id" class="edit-form">
          <form (ngSubmit)="saveEdit()">
            <div class="form-group">
              <label for="edit-title-{{post.id}}">Title</label>
              <input 
                type="text" 
                id="edit-title-{{post.id}}"
                [(ngModel)]="editingPost.title" 
                name="edit-title-{{post.id}}"
                required
                class="form-control">
            </div>

            <!-- Checkboxes de categorías en edición rápida -->
            <div class="form-group" style="margin: 12px 0;">
              <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px;">Categories:</label>
              <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <div *ngFor="let cat of availableCategories" style="display: flex; align-items: center; gap: 4px;">
                  <input 
                    type="checkbox" 
                    [id]="'edit-cat-' + post.id + '-' + cat.id"
                    [value]="cat.id"
                    [checked]="isCategorySelected(cat.id)"
                    (change)="onCategoryToggle(cat.id, $event)">
                  <label [for]="'edit-cat-' + post.id + '-' + cat.id" style="font-size: 12px; cursor: pointer; margin: 0;">
                    {{ cat.name }}
                  </label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="edit-content-{{post.id}}">Content</label>
              <textarea 
                id="edit-content-{{post.id}}"
                [(ngModel)]="editingPost.content" 
                name="edit-content-{{post.id}}"
                rows="6"
                required
                class="form-control"></textarea>
            </div>
            <div class="form-actions" style="margin-top: 12px;">
              <button type="submit" class="btn btn-sm btn-primary">Save</button>
              <button type="button" (click)="cancelEdit()" class="btn btn-sm">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
